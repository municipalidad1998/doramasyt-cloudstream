name: Test DoramaYT Nuvio

on:
  push:
    branches: [main]
    paths:
      - 'src/doramasyt/**'
      - 'providers/doramasyt.js'
      - 'scripts/test-doramasyt.js'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/test-doramasyt.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build provider
        run: node build.js doramasyt
      - name: Test Our Sticky Love T1E1
        run: node scripts/test-doramasyt.js 291496 tv 1 1
