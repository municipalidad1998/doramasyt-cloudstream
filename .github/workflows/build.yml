name: Build and Deploy CloudStream Plugin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Remove stale .gradle cache (if committed by mistake)
        run: rm -rf .gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Build all plugins
        run: ./gradlew make makePluginsJson --no-daemon
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: builds
          clean: false
          commit-message: "🚀 Auto-build from commit ${{ github.sha }}"
