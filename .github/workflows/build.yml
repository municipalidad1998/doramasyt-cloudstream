name: Build CS3 Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Kotlin compiler
        run: |
          KOTLIN_VERSION="1.9.21"
          wget -q "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -O kotlin.zip
          unzip -q kotlin.zip -d /opt/
          echo "/opt/kotlinc/bin" >> $GITHUB_PATH

      - name: Download dependencias
        run: |
          mkdir -p libs
          
          # Jsoup y JSON desde Maven
          wget -q "https://repo1.maven.org/maven2/org/jsoup/jsoup/1.16.1/jsoup-1.16.1.jar" -O libs/jsoup.jar
          wget -q "https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar" -O libs/json.jar
          wget -q "https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.7.3/kotlinx-coroutines-core-jvm-1.7.3.jar" -O libs/coroutines.jar
          
          # Intentar obtener CloudStream API real de JitPack
          CS_SIZE=0
          for URL in \
            "https://jitpack.io/com/github/recloudstream/cloudstream/pre-release-SNAPSHOT/cloudstream-pre-release-SNAPSHOT.jar" \
            "https://jitpack.io/com/github/recloudstream/cloudstream/master-SNAPSHOT/cloudstream-master-SNAPSHOT.jar"; do
            wget -q --timeout=30 "$URL" -O libs/cloudstream-api.jar 2>/dev/null || true
            CS_SIZE=$(wc -c < libs/cloudstream-api.jar 2>/dev/null || echo 0)
            if [ "$CS_SIZE" -gt "10000" ]; then
              echo "✅ CloudStream API: $CS_SIZE bytes"
              break
            fi
          done
          if [ "$CS_SIZE" -le "10000" ]; then
            echo "⚠️ JitPack no disponible - usando stubs"
            touch libs/cloudstream-api.jar
          fi
          
          echo "Dependencias: $(ls -lh libs/)"

      - name: Compilar stubs + providers a .jar
        run: |
          mkdir -p build_output
          CLASSPATH="libs/jsoup.jar:libs/json.jar:libs/coroutines.jar"

          # Usar CloudStream API real si está disponible
          CS_SIZE=$(wc -c < libs/cloudstream-api.jar 2>/dev/null || echo 0)
          if [ "$CS_SIZE" -gt "10000" ]; then
            echo "✅ Usando CloudStream API real ($CS_SIZE bytes)"
            CLASSPATH="libs/cloudstream-api.jar:libs/jsoup.jar:libs/json.jar:libs/coroutines.jar"
            cp libs/cloudstream-api.jar build_output/cloudstream-stubs.jar
          else
            echo "⚠️ Compilando stubs de CloudStream API"
            kotlinc stubs/CloudStreamStubs.kt stubs/CloudStreamUtils.kt \
              -classpath "$CLASSPATH" \
              -d build_output/cloudstream-stubs.jar \
              -jvm-target 1.8 -nowarn 2>&1 | tail -5
            if [ ! -f build_output/cloudstream-stubs.jar ]; then
              echo "❌ Stubs fallaron"
              exit 1
            fi
            echo "✅ Stubs compilados"
            CLASSPATH="libs/jsoup.jar:libs/json.jar:libs/coroutines.jar:build_output/cloudstream-stubs.jar"
          fi
          
          PROVIDERS=(
            "DoramasYTProvider"
            "DoramasFlixProvider"
            "DoramasiaProvider"
            "PeliCineHDProvider"
            "PelisJuanitaProvider"
          )
          
          for PROVIDER in "${PROVIDERS[@]}"; do
            KT_FILE="$PROVIDER/src/main/kotlin/com/cncverse/${PROVIDER}.kt"
            echo "=== Compilando $PROVIDER ==="
            kotlinc "$KT_FILE" \
              -classpath "$CLASSPATH" \
              -d "build_output/${PROVIDER}.jar" \
              -jvm-target 1.8 -nowarn 2>&1 | tail -10
            
            if [ -f "build_output/${PROVIDER}.jar" ]; then
              echo "✅ ${PROVIDER} compilado ($(wc -c < build_output/${PROVIDER}.jar) bytes)"
            else
              echo "❌ ${PROVIDER} falló"
            fi
          done

      - name: Convertir .jar a .cs3 (ZIP con manifest + DEX)
        run: |
          mkdir -p output
          D8=$(find $ANDROID_SDK_ROOT -name "d8" -type f 2>/dev/null | head -1)
          ANDROID_JAR=$(find $ANDROID_SDK_ROOT/platforms -name "android.jar" 2>/dev/null | head -1)
          KOTLIN_STDLIB="/opt/kotlinc/lib/kotlin-stdlib.jar"
          echo "d8: $D8  android.jar: $ANDROID_JAR"
          
          # --lib excluye las clases del output DEX
          LIB_ARGS="--lib $ANDROID_JAR --lib $KOTLIN_STDLIB --lib libs/coroutines.jar --lib libs/jsoup.jar --lib libs/json.jar --lib build_output/cloudstream-stubs.jar"
          
          for JAR in build_output/DoramasYTProvider.jar build_output/DoramasFlixProvider.jar \
                     build_output/DoramasiaProvider.jar build_output/PeliCineHDProvider.jar \
                     build_output/PelisJuanitaProvider.jar; do
            if [ ! -f "$JAR" ]; then echo "Skipping $JAR"; continue; fi
            PROVIDER=$(basename "$JAR" .jar)
            echo "=== Procesando $PROVIDER ==="
            
            # 1. Convertir JAR → DEX
            mkdir -p "dex_out/$PROVIDER"
            "$D8" "$JAR" $LIB_ARGS --output "dex_out/$PROVIDER" --min-api 21 2>&1 | tail -3
            
            if [ ! -f "dex_out/$PROVIDER/classes.dex" ]; then
              echo "❌ Sin DEX para $PROVIDER"
              continue
            fi
            
            # 2. Crear ZIP con manifest.json + classes.dex (formato .cs3 correcto)
            cd "dex_out/$PROVIDER"
            cp "../../manifests/${PROVIDER}.json" manifest.json
            zip -q "${PROVIDER}.cs3" manifest.json classes.dex
            cp "${PROVIDER}.cs3" "../../output/"
            cd ../..
            
            echo "✅ ${PROVIDER}.cs3 ($(wc -c < output/${PROVIDER}.cs3) bytes)"
          done
          
          echo "=== output/ ==="
          ls -lh output/ || echo "(vacío)"

      - name: Generar plugins.json
        run: python3 scripts/make_plugins_json.py output

      - name: Publicar en rama builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds 2>/dev/null || true
          git checkout -B builds origin/builds 2>/dev/null || git checkout --orphan builds
          git rm -rf --cached *.cs3 plugins.json 2>/dev/null || true
          cp output/*.cs3      . 2>/dev/null || true
          cp output/plugins.json .
          git add *.cs3 plugins.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Build $(date +'%Y-%m-%d %H:%M') [$(git log origin/main -1 --pretty=format:'%h')]"
          git push origin builds
          echo "✅ Publicado en rama builds"

# Nota: este bloque no se ejecuta, es solo referencia
