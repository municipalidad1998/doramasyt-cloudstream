name: Build CS3 Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Ver tasks disponibles
        run: gradle tasks --all 2>&1 | grep -i "make\|cs3\|build" || true

      - name: Build cada módulo explícitamente
        run: |
          gradle :DoramasYTProvider:make    --stacktrace || echo "DoramasYTProvider falló"
          gradle :DoramasFlixProvider:make  --stacktrace || echo "DoramasFlixProvider falló"
          gradle :DoramasiaProvider:make    --stacktrace || echo "DoramasiaProvider falló"
          gradle :PeliCineHDProvider:make   --stacktrace || echo "PeliCineHDProvider falló"
          gradle :PelisJuanitaProvider:make --stacktrace || echo "PelisJuanitaProvider falló"

      - name: Buscar .cs3 en todo el árbol
        run: |
          echo "=== Buscando .cs3 ==="
          find . -name "*.cs3" -not -path "./.git/*" 2>/dev/null | head -20 || true
          echo "=== Buscando en build/ ==="
          find . -path "*/build/*" -name "*.cs3" 2>/dev/null | head -20 || true
          find . -path "*/build/*" -name "*.jar" 2>/dev/null | head -20 || true

      - name: Recopilar .cs3
        run: |
          mkdir -p output
          find . -name "*.cs3" -not -path "./.git/*" -exec cp {} output/ \;
          find . -name "*.jar" -path "*/build/libs/*" -exec cp {} output/ \;
          echo "Archivos en output:"
          ls -lh output/ || echo "(vacío)"

      - name: Generar plugins.json
        run: python3 scripts/make_plugins_json.py output

      - name: Publicar en rama builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds 2>/dev/null || true
          git checkout -B builds origin/builds 2>/dev/null || git checkout --orphan builds
          git rm -rf --cached *.cs3 plugins.json 2>/dev/null || true
          cp output/*.cs3      . 2>/dev/null || true
          cp output/plugins.json .
          git add *.cs3 plugins.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Build $(date +'%Y-%m-%d %H:%M') [$(git log origin/main -1 --pretty=format:'%h')]"
          git push origin builds
          echo "Publicado en rama builds"
