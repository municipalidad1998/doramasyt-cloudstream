name: Build CS3 Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Kotlin compiler
        run: |
          KOTLIN_VERSION="1.9.21"
          wget -q "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -O kotlin.zip
          unzip -q kotlin.zip -d /opt/
          echo "/opt/kotlinc/bin" >> $GITHUB_PATH
          echo "✅ kotlinc instalado"

      - name: Download dependencias (CloudStream API + Jsoup + JSON)
        run: |
          mkdir -p libs
          
          # CloudStream API stub para compilación
          wget -q "https://jitpack.io/com/github/recloudstream/cloudstream/master-SNAPSHOT/cloudstream-master-SNAPSHOT.jar" \
            -O libs/cloudstream-api.jar 2>/dev/null || \
          wget -q "https://jitpack.io/com/github/recloudstream/cloudstream/pre-release-SNAPSHOT/cloudstream-pre-release-SNAPSHOT.jar" \
            -O libs/cloudstream-api.jar 2>/dev/null || true
          
          # Jsoup para scraping HTML
          wget -q "https://repo1.maven.org/maven2/org/jsoup/jsoup/1.16.1/jsoup-1.16.1.jar" -O libs/jsoup.jar
          
          # org.json para JSON parsing
          wget -q "https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar" -O libs/json.jar
          
          echo "=== Dependencias descargadas ==="
          ls -lh libs/

      - name: Compilar cada provider a .jar
        run: |
          mkdir -p build_output
          
          CLASSPATH="libs/cloudstream-api.jar:libs/jsoup.jar:libs/json.jar"
          
          PROVIDERS=(
            "DoramasYTProvider"
            "DoramasFlixProvider"
            "DoramasiaProvider"
            "PeliCineHDProvider"
            "PelisJuanitaProvider"
          )
          
          for PROVIDER in "${PROVIDERS[@]}"; do
            KT_FILE="$PROVIDER/src/main/kotlin/com/cncverse/${PROVIDER}.kt"
            echo "Compilando $PROVIDER..."
            
            kotlinc "$KT_FILE" \
              -classpath "$CLASSPATH" \
              -d "build_output/${PROVIDER}.jar" \
              -jvm-target 1.8 \
              -nowarn 2>&1 | tail -5 || true
            
            if [ -f "build_output/${PROVIDER}.jar" ]; then
              echo "✅ $PROVIDER compilado ($(wc -c < build_output/${PROVIDER}.jar) bytes)"
            else
              echo "❌ $PROVIDER falló en compilación"
            fi
          done

      - name: Convertir .jar a .cs3 con d8
        run: |
          mkdir -p output
          
          D8=$(find $ANDROID_SDK_ROOT -name "d8" -type f 2>/dev/null | head -1)
          echo "d8 encontrado en: $D8"
          
          for JAR in build_output/*.jar; do
            PROVIDER=$(basename "$JAR" .jar)
            echo "Convirtiendo $PROVIDER..."
            
            mkdir -p "dex_output/$PROVIDER"
            "$D8" "$JAR" \
              --output "dex_output/$PROVIDER" \
              --min-api 21 2>&1 | tail -3 || true
            
            if [ -f "dex_output/$PROVIDER/classes.dex" ]; then
              cp "dex_output/$PROVIDER/classes.dex" "output/${PROVIDER}.cs3"
              echo "✅ ${PROVIDER}.cs3 creado ($(wc -c < output/${PROVIDER}.cs3) bytes)"
            else
              echo "❌ $PROVIDER falló en conversión DEX"
            fi
          done
          
          echo "=== output/ ==="
          ls -lh output/ || echo "(vacío)"

      - name: Generar plugins.json
        run: python3 scripts/make_plugins_json.py output

      - name: Publicar en rama builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds 2>/dev/null || true
          git checkout -B builds origin/builds 2>/dev/null || git checkout --orphan builds
          git rm -rf --cached *.cs3 plugins.json 2>/dev/null || true
          cp output/*.cs3      . 2>/dev/null || true
          cp output/plugins.json .
          git add *.cs3 plugins.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Build $(date +'%Y-%m-%d %H:%M') [$(git log origin/main -1 --pretty=format:'%h')]"
          git push origin builds
          echo "✅ Publicado en rama builds"
