name: Build

permissions:
  contents: write

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew :DoramasYTProvider:make --no-daemon --stacktrace
          find $GITHUB_WORKSPACE/src -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          FILE_SIZE=$(stat -c%s $GITHUB_WORKSPACE/builds/DoramasYTProvider.cs3)
          cat > $GITHUB_WORKSPACE/builds/plugins.json << 'JSONEOF'
[
    {
        "url": "https://raw.githubusercontent.com/municipalidad1998/doramasyt-cloudstream/refs/heads/builds/DoramasYTProvider.cs3",
        "status": 1,
        "version": 1,
        "name": "DoramasYT",
        "internalName": "DoramasYTProvider",
        "authors": ["municipalidad1998"],
        "description": "Doramas con subtitulos en Espanol y Latino",
        "fileSize": FILESIZE_PLACEHOLDER,
        "repositoryUrl": "https://github.com/municipalidad1998/doramasyt-cloudstream",
        "language": "es",
        "tvTypes": ["AsianDrama", "TvSeries"],
        "iconUrl": "https://github.com/municipalidad1998/doramasyt-cloudstream/raw/refs/heads/master/DoramasYTProvider/icon.png",
        "apiVersion": 1
    }
]
JSONEOF
          sed -i "s/FILESIZE_PLACEHOLDER/$FILE_SIZE/g" $GITHUB_WORKSPACE/builds/plugins.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
