name: Build CS3 Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle wrapper
        run: |
          gradle wrapper --gradle-version 7.6
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build plugins
        run: ./gradlew makeAll --info --stacktrace

      - name: Recopilar .cs3
        run: |
          mkdir -p output
          find . -name "*.cs3" -not -path "./.git/*" -exec cp {} output/ \;
          echo "CS3 files encontrados:"
          ls -lh output/ || echo "(ninguno)"

      - name: Generar plugins.json
        run: python3 scripts/make_plugins_json.py output

      - name: Publicar en rama builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds 2>/dev/null || true
          git checkout -B builds origin/builds 2>/dev/null || git checkout --orphan builds
          git rm -rf --cached *.cs3 plugins.json 2>/dev/null || true
          cp output/*.cs3      . 2>/dev/null || true
          cp output/plugins.json .
          git add *.cs3 plugins.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Build $(date +'%Y-%m-%d %H:%M') [$(git log origin/main -1 --pretty=format:'%h')]"
          git push origin builds
          echo "Publicado en rama builds"
