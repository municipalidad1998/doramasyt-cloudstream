name: Build

permissions:
  contents: write

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build All Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make --no-daemon --stacktrace
          find $GITHUB_WORKSPACE/src -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          ls -la $GITHUB_WORKSPACE/builds/

      - name: Generate plugins.json
        run: |
          cd $GITHUB_WORKSPACE/builds
          python3 << 'PYEOF'
          import json
          import os
          import glob

          plugins = []
          
          # Find all .cs3 files in the builds directory
          cs3_files = glob.glob('*.cs3')
          print(f"Found {len(cs3_files)} .cs3 files: {cs3_files}")
          
          provider_info = {
              'DoramasYTProvider': {
                  'name': 'DoramasYT',
                  'description': 'Doramas con subtitulos en Espanol y Latino',
                  'types': ['AsianDrama', 'TvSeries']
              },
              'DoramasFlixProvider': {
                  'name': 'DoramasFlix',
                  'description': 'Doramas subtitulados en espanol',
                  'types': ['AsianDrama', 'TvSeries']
              },
              'DoramasiaProvider': {
                  'name': 'Doramasia',
                  'description': 'Doramas y series asiaticas en espanol',
                  'types': ['AsianDrama', 'TvSeries']
              },
              'PelisJuanitaProvider': {
                  'name': 'PelisJuanita',
                  'description': 'Peliculas y series en espanol latino HD',
                  'types': ['Movie', 'TvSeries']
              },
              'PeliCineHDProvider': {
                  'name': 'PeliCineHD',
                  'description': 'Peliculas y series en HD 1080P Latino',
                  'types': ['Movie', 'TvSeries']
              }
          }

          for cs3_file in cs3_files:
              fname = os.path.basename(cs3_file)
              fsize = os.path.getsize(cs3_file)
              
              # Try to match with provider info
              matched = False
              for provider_dir, info in provider_info.items():
                  if provider_dir.lower() in fname.lower() or fname.lower().replace('.cs3', '') in provider_dir.lower():
                      plugins.append({
                          'url': f'https://raw.githubusercontent.com/municipalidad1998/doramasyt-cloudstream/refs/heads/builds/{fname}',
                          'status': 1,
                          'version': 1,
                          'name': info['name'],
                          'internalName': provider_dir,
                          'authors': ['municipalidad1998'],
                          'description': info['description'],
                          'fileSize': fsize,
                          'repositoryUrl': 'https://github.com/municipalidad1998/doramasyt-cloudstream',
                          'language': 'es',
                          'tvTypes': info['types'],
                          'iconUrl': f'https://github.com/municipalidad1998/doramasyt-cloudstream/raw/refs/heads/master/{provider_dir}/icon.png',
                          'apiVersion': 1
                      })
                      matched = True
                      break
              
              if not matched:
                  # Use filename as fallback
                  clean_name = fname.replace('.cs3', '').replace('Provider', '')
                  plugins.append({
                      'url': f'https://raw.githubusercontent.com/municipalidad1998/doramasyt-cloudstream/refs/heads/builds/{fname}',
                      'status': 1,
                      'version': 1,
                      'name': clean_name,
                      'internalName': fname.replace('.cs3', ''),
                      'authors': ['municipalidad1998'],
                      'description': f'{clean_name} provider',
                      'fileSize': fsize,
                      'repositoryUrl': 'https://github.com/municipalidad1998/doramasyt-cloudstream',
                      'language': 'es',
                      'tvTypes': ['Movie', 'TvSeries'],
                      'iconUrl': '',
                      'apiVersion': 1
                  })

          with open('plugins.json', 'w') as f:
              json.dump(plugins, f, indent=4)
          
          print(f'Generated plugins.json with {len(plugins)} plugins')
          for p in plugins:
              print(f"  - {p['name']} ({p.get('fileSize', 0)} bytes)")
          PYEOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force
