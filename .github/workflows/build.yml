name: Build CS3 Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build con info detallado
        run: |
          gradle :DoramasYTProvider:make --info 2>&1 | tail -50

      - name: Debug - ver TODOS los archivos creados
        run: |
          echo "=== Archivos .cs3 ==="
          find / -name "*.cs3" 2>/dev/null | grep -v proc | grep -v sys || true
          echo ""
          echo "=== Archivos en build/ de cada módulo ==="
          for m in DoramasYTProvider DoramasFlixProvider DoramasiaProvider PeliCineHDProvider PelisJuanitaProvider; do
            echo "--- $m/build/ ---"
            find "$m/build" -type f 2>/dev/null | head -20 || echo "(vacío)"
          done
          echo ""
          echo "=== Directorio builds/ en raíz ==="
          ls -la builds/ 2>/dev/null || echo "(no existe)"

      - name: Build todos los módulos
        run: |
          gradle :DoramasYTProvider:make    || true
          gradle :DoramasFlixProvider:make  || true
          gradle :DoramasiaProvider:make    || true
          gradle :PeliCineHDProvider:make   || true
          gradle :PelisJuanitaProvider:make || true

      - name: Encontrar .cs3 después del build
        run: |
          echo "=== Buscando .cs3 en TODO el sistema ==="
          find / -name "*.cs3" 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" || echo "Ninguno"
          echo ""
          echo "=== Directorio builds/ en raíz ==="
          ls -la builds/ 2>/dev/null || echo "(no existe)"
          echo ""
          echo "=== build/outputs en módulos ==="
          find . -path "*/build/outputs*" -type f 2>/dev/null | head -20 || true
          find . -path "*/build/libs*" -type f 2>/dev/null | head -20 || true

      - name: Recopilar .cs3
        run: |
          mkdir -p output
          # Buscar en todas las ubicaciones posibles
          find / -name "*.cs3" 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | \
            xargs -I{} cp {} output/ 2>/dev/null || true
          # También buscar en el directorio builds/ de Gradle
          cp builds/*.cs3 output/ 2>/dev/null || true
          echo "=== CS3 en output: ==="
          ls -lh output/ || echo "(vacío)"

      - name: Generar plugins.json
        run: python3 scripts/make_plugins_json.py output

      - name: Publicar en rama builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds 2>/dev/null || true
          git checkout -B builds origin/builds 2>/dev/null || git checkout --orphan builds
          git rm -rf --cached *.cs3 plugins.json 2>/dev/null || true
          cp output/*.cs3      . 2>/dev/null || true
          cp output/plugins.json .
          git add *.cs3 plugins.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Build $(date +'%Y-%m-%d %H:%M') [$(git log origin/main -1 --pretty=format:'%h')]"
          git push origin builds
          echo "Publicado en rama builds"
