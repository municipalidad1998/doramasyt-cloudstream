name: Build Nuvio Providers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'package.json'
      - 'manifest.json'
      - '.github/workflows/build-nuvio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build providers
        run: node build.js

      - name: Commit generated providers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Nuvio providers"
            git pull --rebase origin main
            git push
          fi
