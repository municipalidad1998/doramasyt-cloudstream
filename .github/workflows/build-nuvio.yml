name: Build Nuvio Providers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - 'package.json'
      - 'manifest.json'
      - '.github/workflows/build-nuvio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-nuvio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build providers
        run: node build.js

      - name: Publish generated providers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Build Nuvio providers"

          # Generated providers are derived artifacts. Rebase can conflict with
          # previous generated versions, so always take the freshly generated
          # files from this run after bringing main up to date.
          git fetch origin main
          git rebase origin/main || {
            git checkout --theirs providers/
            git add providers/
            GIT_EDITOR=true git rebase --continue
          }

          git push origin HEAD:main
